<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Roommate Finder</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <form class="login-form" id="loginForm">
            <h2>Đăng Nhập</h2>
            <div class="input-group">
                <label for="username">Tên tài khoản</label>
                <input type="text" id="username" placeholder="Nhập tên đăng nhập" required>
            </div>
            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu" required>
            </div>
            <button type="submit" class="login-btn">Đăng Nhập</button>
            <div class="extra-links">
                <a href="../forgot_password/forgot_password.html" class="forgot-pwd">Quên mật khẩu?</a>
                <p>Chưa có tài khoản? <a href="../register/register.html">Đăng ký ngay</a></p>
            </div>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
