<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Roommate Finder</title>
    <link rel="stylesheet" href="forgot_password.css">
</head>
<body>
    <div class="forgot-container">
        <form class="forgot-form" id="resetPwdForm" action="/reset-password" method="POST">
            <h2>Đặt lại mật khẩu</h2>
            
            <div class="input-group">
                <label>Tên đăng nhập</label>
                <input type="text" name="username" placeholder="Nhập username" required>
            </div>
            
            <div class="input-group">
                <label>Số điện thoại</label>
                <input type="tel" name="phone" placeholder="Nhập SĐT đã đăng ký" required>
            </div>

            <hr style="margin-bottom: 20px; border: 0.5px solid #eee;">

            <div class="input-group">
                <label>Mật khẩu mới</label>
                <input type="password" name="new_password" id="new_password" placeholder="••••••••" required>
            </div>

            <div class="input-group">
                <label>Xác nhận mật khẩu mới</label>
                <input type="password" name="confirm_password" id="confirm_password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="forgot-btn">Cập nhật mật khẩu</button>
            
            <div class="extra-links">
                <a href="../login/login.html">Quay lại đăng nhập</a>
            </div>
        </form>
    </div>
    <script src="forgot_password.js"></script>
</body>
</html>
